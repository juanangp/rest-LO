# LiquidO: restG4 output -> scintillation photons -> photoelectrons of the photons captured by the fibres
# (SiPMs) -> raw signals of the SiPMs (electronics) -> hits
# XZ (fibres along Y) and YZ (fibres along X) -> tracks. It replaces the macro Geant4ToSignal.C (same
# parameters, now in the processes):
#   restManager --c Geant4ToTracks.yaml --i Run<number>_restG4_<tag>_<user>.root  # liquidO.yaml
# The readout is LiquidO.root of rest-common-readouts (the fibres of the GDML are its
# LiquidO_Readout_fibres.xml).
#
# Correspondence with the constants of Geant4ToSignal.C:
# - particleQuenchingMap (0.1 for ions) -> quenching (Birks law, kB = 0.1 mm/MeV);
# - photoElectronsPerkeV (0.4), lightSigma (10 mm) -> lightYield of the medium (scintillation),
#   captureProbability of lightCollection (localCapture: Gaussian light ball of sigma 10 mm, the opaque
#   scintillator) and its quantumEfficiency (SiPMs). An amplitude 0.0318 gives 0.4 photoelectrons per keV
#   in total: the sum over the fibres of both families is ~ 2 pi sigma^2 / pitch^2 = 3.14 times the amplitude,
#   10 * 3.14 * 0.0318 * 0.4 = 0.4. Replace it with the capture probability of an optical simulation
#   ("file.root:graphName");
# - timeResolution (0.04 us), nTimeBins (512), timeOffset (4 us), trigger at the first photoelectron ->
#   signalToRaw (sampling, nPoints, triggerDelay, triggerMode firstDeposit);
# - shapingTime (10 bins), gain (10, the sum of the response) -> signalShaping (0.4 us, gain: height of the
#   pulse of a photoelectron, 0.76 ADC for that response); ADCOffset (250) -> offset; noiseLevel (2 ADC) ->
#   addNoise;
# - points over threshold (2 sigma, 2 points) and amplitude and time of the maximum -> rawToSignal and
#   signalToHits (onlyMax);
# - trackDistance (30 mm) -> hitsToTrack (clusterDistance), tracks of XZ and YZ hits separately.
# The resolution 1/sqrt(N) of the macro was applied to a copy of the data (no effect); here the fluctuations
# are those of the photoelectrons (Poisson).
#
# Beyond the macro (placeholders to be measured): the LiquidO fibres are read at both ends or at one end with
# the other one reflective; LiquidO.root reads them at one end (readoutEnd of the fibre families), the other
# end reflecting endReflectivity of the `wls` response of the fibres (Y11, wlsMedium of lightCollection).
# captureProbability is the capture by the fibre: half of the photons go directly to the read end and half
# to the other end (reflected back, or to its own channel with readoutEnd "both", where endReflectivity is not
# used), attenuated and delayed along the fibre. The amplitude 0.0335 keeps the 0.4 photoelectrons per keV
# of the macro before the transport in the fibre: 0.0335 * (1 + 0.9) / 2 = 0.0318 (0.0318 with both ends
# read; to be tuned again: the attenuation along the fibre gives less light); lightCollection gives each
# photoelectron its time (scintillation profile of the liquid, re-emission of the fibre), photosensor the
# response of the SiPMs (a hit per avalanche: jitter, gain spread; dark counts, crosstalk, afterpulses and
# cell saturation commented until measured), and hitsToSignal collects them in the channels.

manager:
  class: "TRestManager"
  name: "manager"

  run:
    class: "TRestRun"
    name: "restRun"
    inheritInputRun: true
    runUser: "${ENV:USER}"
    runDescription: "Geant4ToTracks"
    inputFileName: ""
    outputFileName: "Run[runNumber]_TRACK_[runTag]_[runUser].root"

  readoutManager:
    class: "TRestDetectorReadoutManager"
    readouts:
      - inputFileName: "https://github.com/rest-for-physics-toolkit/rest-common-readouts/releases/download/v1.0/LiquidO.root"
        instanceName: "LiquidO_Readout"
        decodingName: "nominal_decoding"

  medium:
    class: "TRestDetectorMedium"
    name: "LiquidScintillator"
    state: "liquid"
    light:
      lightYield: 10  # photons per keV
      scintillation:
        - components:
            - {fraction: 1, riseTime: 1 ns, decayTime: 4.5 ns}

  fibres:
    class: "TRestDetectorMedium"
    name: "Y11"
    state: "solid"
    wls:
      attenuationLength: 3.5 m
      lightSpeed: 170 mm/ns
      decayTime: 7 ns
      endReflectivity: 0.9  # mirrored end not read (placeholder)

  pipeline:
    class: "TRestEventProcessManager"
    name: "pipeline"
    eventsToProcess: 0
    outputEventStorage: true  # only the tracks (and the analysis tree); true stores every event of the chain
    quenching:
      class: "TRestGeant4QuenchingProcess"
      volume:
        - name: "chamber"
          model: "birks"
          birksConstant: 0.0001  # mm/keV
      observables: ["sensitiveVolumeEnergyBefore", "sensitiveVolumeEnergyAfter"]
    geant4ToHits:
      class: "TRestGeant4ToDetectorHitsProcess"
      volumes: ["chamber"]
    scintillation:
      class: "TRestDetectorScintillationProcess"
      medium: "LiquidScintillator"
      observables: ["NPhotons"]
    lightCollection:
      class: "TRestDetectorLightCollectionProcess"
      model: "localCapture"
      captureProbability: "0.0335*exp(-x*x/(2*10*10))"
      maxDistance: 30 mm  # 3 sigma of the light ball: exp(-30^2 / (2 * 10^2)) = 1 % of the capture at 0
      wlsMedium: "Y11"
      quantumEfficiency: 0.4  # SiPMs
      observables: ["NPhotoelectrons", "NHitsWithoutChannel"]
    photosensor:
      class: "TRestDetectorPhotosensorProcess"
      timeJitter: 0.2 ns  # SiPMs
      gainSpread: 0.1  # SiPMs
      # Not modelled yet (values of the SiPMs to be measured):
      # darkCountRate: 100 kHz
      # darkCountWindow: [-4 us, 16.48 us]  # the raw signal window (triggerDelay, 512 x 40 ns)
      # crosstalkProbability: 0.05
      # afterpulseProbability: 0.02
      # afterpulseDelay: 50 ns
      # cells: 3600
      # cellRecoveryTime: 50 ns
    hitsToSignal:
      class: "TRestDetectorHitsToSignalProcess"
      sampling: 0.04 us
    signalShaping:
      class: "TRestDetectorSignalShapingProcess"
      shapingType: "shaperSin"
      shapingTime: 0.4 us
      gain: 0.76
    signalToRaw:
      class: "TRestDetectorSignalToRawSignalProcess"
      sampling: 0.04 us
      nPoints: 512
      mode: "sample"
      triggerMode: "firstDeposit"
      triggerDelay: 4 us
      gain: 1
      offset: 250
      maxValue: 32767
      observables: ["TriggerTime", "NSaturatedSignals"]
    addNoise:
      class: "TRestRawSignalAddNoiseProcess"
      noise:
        - method: "white"
          amplitude: 2
    rawToSignal:
      class: "TRestRawToDetectorSignalProcess"
      sampling: 0.04
      triggerStarts: 0
      gain: 1
      zeroSuppression: true
      baselineRange: [0, 90]
      integralRange: [100, 511]
      pointsThreshold: 2
      signalThreshold: 1
      pointsOverThreshold: 2
      observables: ["NSignalsRejected"]
    signalToHits:
      class: "TRestDetectorSignalToHitsProcess"
      method: "onlyMax"
      smoothingPoints: 1
    hitsToTrack:
      class: "TRestDetectorHitsToTrackProcess"
      clusterDistance: 30 mm
